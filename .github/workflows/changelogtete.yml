
name: Gerar Changelog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar changelog
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Ultimas alteracoes do repositorio:" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          git log -10 --date=short \
            --pretty=format:"- %ad | %an | %s" \
            >> CHANGELOG.md

          echo "" >> CHANGELOG.md

          cat CHANGELOG.md

      - name: Salvar changelog no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: atualizar changelog"
            git push
          else
            echo "Nenhuma alteracao no changelog."
          fi
